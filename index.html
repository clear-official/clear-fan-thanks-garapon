<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5b9b" />
  <title>ファン感謝祭｜ガラポン抽選</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="confetti-layer" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <img class="banner" src="assets/banner.png" alt="ファン感謝祭 口コミ・体験談を教えてください" />
      <h1 id="page-title" class="sr-only">ファン感謝祭 ガラポン抽選</h1>
    </section>

    <section class="lottery-card" aria-live="polite">
      <h2>ガラポンを回して<br />結果を確認してください</h2>

      <div id="garaponArea" class="garapon-area">
        <div id="garapon" class="garapon" aria-hidden="true">
          <div class="garapon-top"></div>
          <div class="garapon-body">
            <span class="motif moon moon-1">☾</span>
            <span class="motif star star-1">★</span>
            <span class="motif star star-2">✦</span>
            <span class="motif moon moon-2">☾</span>
            <span class="motif star star-3">★</span>
          </div>
          <div class="garapon-axis"></div>
          <div class="garapon-handle"><span></span></div>
          <div class="garapon-leg garapon-leg-left"></div>
          <div class="garapon-leg garapon-leg-right"></div>
          <div class="garapon-base"></div>
          <div id="lotteryBall" class="lottery-ball"></div>
        </div>
      </div>

      <div id="statusBox" class="status-box" hidden></div>

      <button id="drawButton" class="draw-button" type="button" disabled>
        <span>ガラポンを回す</span>
      </button>

      <p class="period">抽選期間：2026年8月7日 0:00〜8月10日 24:00</p>
    </section>

    <section id="resultPanel" class="result-panel" hidden>
      <p class="result-label">抽選結果</p>
      <h2 id="resultRank">参加賞</h2>
      <p id="resultPoints" class="result-points">500<span>pt獲得</span></p>

      <div class="code-box">
        <p>キャンペーンコード</p>
        <div class="code-row">
          <strong id="campaignCode">R7MF3K8NP</strong>
          <button id="copyButton" type="button">コピー</button>
        </div>
      </div>

      <p class="deadline">コード利用期限：2026年8月11日 24:00まで</p>
      <p id="copyMessage" class="copy-message" aria-live="polite"></p>
    </section>

    <p class="notice">キャンペーンコードは、お一人につき1回のみご利用いただけます。</p>
  </main>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>確認中です…</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
